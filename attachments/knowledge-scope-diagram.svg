<svg viewBox="-150 40 900 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui, -apple-system, sans-serif">

  <defs>
    <clipPath id="clip-raw">
      <circle cx="220" cy="210" r="155"/>
    </clipPath>
    <clipPath id="clip-lib">
      <circle cx="460" cy="210" r="155"/>
    </clipPath>
    <clipPath id="clip-iac">
      <circle cx="340" cy="375" r="155"/>
    </clipPath>

    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff9800"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4caf50"/>
    </marker>
  </defs>

  <!-- Three circles -->
  <circle cx="220" cy="210" r="155" fill="rgba(158,158,158,0.10)" stroke="#9e9e9e" stroke-width="2"/>
  <circle cx="460" cy="210" r="155" fill="rgba(76,175,80,0.10)" stroke="#4caf50" stroke-width="2"/>
  <circle cx="340" cy="375" r="155" fill="rgba(33,150,243,0.10)" stroke="#2196f3" stroke-width="2"/>

  <!-- Three-circle intersection = Digest (orange fill) -->
  <g clip-path="url(#clip-raw)">
    <g clip-path="url(#clip-lib)">
      <circle cx="340" cy="375" r="155" fill="rgba(255,152,0,0.45)" stroke="#ff9800" stroke-width="2" stroke-dasharray="6,3"/>
    </g>
  </g>

  <!-- Circle labels -->
  <text x="95" y="110" font-size="20" font-weight="bold" fill="#757575">Raw Notes</text>
  <text x="95" y="135" font-size="14" fill="#9e9e9e">團隊原始筆記</text>

  <!-- Raw Notes sub-boxes -->
  <rect x="100" y="155" width="104" height="40" rx="6" fill="rgba(158,158,158,0.15)" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="152" y="173" font-size="13" font-weight="bold" fill="#616161" text-anchor="middle">username</text>
  <text x="152" y="189" font-size="11" fill="#9e9e9e" text-anchor="middle">隊員筆記</text>

  <rect x="100" y="207" width="104" height="40" rx="6" fill="rgba(158,158,158,0.15)" stroke="#9e9e9e" stroke-width="1.5"/>
  <text x="152" y="225" font-size="13" font-weight="bold" fill="#616161" text-anchor="middle">_feedback</text>
  <text x="152" y="241" font-size="11" fill="#9e9e9e" text-anchor="middle">缺口分析報告</text>

  <text x="500" y="95" font-size="20" font-weight="bold" fill="#388e3c">Library (TBD)</text>

  <text x="340" y="525" font-size="20" font-weight="bold" fill="#1976d2" text-anchor="middle">IaC Repos</text>
  <text x="340" y="547" font-size="14" fill="#64b5f6" text-anchor="middle">Terraform / Serverless</text>

  <!-- IaC sub-boxes -->
  <rect x="295" y="410" width="104" height="40" rx="6" fill="rgba(33,150,243,0.15)" stroke="#2196f3" stroke-width="1.5"/>
  <text x="347" y="428" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">ConfigManager</text>
  <text x="347" y="444" font-size="11" fill="#64b5f6" text-anchor="middle">部署設定</text>

  <rect x="295" y="458" width="104" height="40" rx="6" fill="rgba(33,150,243,0.15)" stroke="#2196f3" stroke-width="1.5"/>
  <text x="347" y="476" font-size="13" font-weight="bold" fill="#1565c0" text-anchor="middle">TerraformIaC</text>
  <text x="347" y="492" font-size="11" fill="#64b5f6" text-anchor="middle">Terraform 模組</text>

  <!-- Library-only region: _inbox + shared-docs + team-docs -->
  <rect x="485" y="150" width="104" height="40" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="537" y="168" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">_inbox</text>
  <text x="537" y="184" font-size="11" fill="#558b2f" text-anchor="middle">待處理文件</text>

  <rect x="485" y="202" width="104" height="40" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="537" y="220" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">shared-docs</text>
  <text x="537" y="236" font-size="11" fill="#558b2f" text-anchor="middle">跨團隊共享文件</text>

  <rect x="485" y="254" width="104" height="40" rx="6" fill="rgba(76,175,80,0.15)" stroke="#4caf50" stroke-width="1.5"/>
  <text x="537" y="272" font-size="13" font-weight="bold" fill="#2e7d32" text-anchor="middle">team-docs</text>
  <text x="537" y="288" font-size="11" fill="#558b2f" text-anchor="middle">團隊工作文件</text>

  <!-- Digest label -->
  <text x="340" y="260" font-size="18" font-weight="bold" fill="#e65100" text-anchor="middle">Digest</text>
  <text x="340" y="282" font-size="13" fill="#e65100" text-anchor="middle">R ∩ L ∩ I</text>
  <text x="340" y="300" font-size="12" fill="#ff9800" text-anchor="middle">AI 精煉 + 交叉驗證</text>

  <!-- Arrow: Digest → DevOps 分析師 (往左) -->
  <line x1="310" y1="290" x2="40" y2="290" stroke="#ff9800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="30" y="280" font-size="16" font-weight="bold" fill="#e65100" text-anchor="end">🤖 DevOps</text>
  <text x="30" y="302" font-size="16" font-weight="bold" fill="#e65100" text-anchor="end">分析師</text>

  <!-- Arrow: shared-docs → DevOps 小幫手 (往右) -->
  <line x1="589" y1="222" x2="630" y2="222" stroke="#4caf50" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="640" y="212" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="start">🤖 DevOps</text>
  <text x="640" y="234" font-size="16" font-weight="bold" fill="#2e7d32" text-anchor="start">小幫手</text>

</svg>
